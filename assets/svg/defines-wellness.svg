<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="105" r="85" fill="#AAB396" opacity=".07"/>

  <!-- Lotus petals breathing -->
  <g transform="translate(100,130)">
    <path d="M0,0 C-10,-30 -5,-55 0,-70 C5,-55 10,-30 0,0Z" fill="#AAB396" opacity=".3">
      <animate attributeName="d" values="M0,0 C-10,-30 -5,-55 0,-70 C5,-55 10,-30 0,0Z;M0,0 C-12,-32 -6,-58 0,-74 C6,-58 12,-32 0,0Z;M0,0 C-10,-30 -5,-55 0,-70 C5,-55 10,-30 0,0Z" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C-25,-15 -50,-30 -55,-55 C-35,-35 -15,-25 0,0Z" fill="#FBCB77" opacity=".2">
      <animate attributeName="d" values="M0,0 C-25,-15 -50,-30 -55,-55 C-35,-35 -15,-25 0,0Z;M0,0 C-28,-18 -55,-34 -62,-60 C-40,-38 -18,-28 0,0Z;M0,0 C-25,-15 -50,-30 -55,-55 C-35,-35 -15,-25 0,0Z" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C-35,-5 -60,-10 -70,-30 C-50,-20 -25,-15 0,0Z" fill="#AAB396" opacity=".15">
      <animate attributeName="d" values="M0,0 C-35,-5 -60,-10 -70,-30 C-50,-20 -25,-15 0,0Z;M0,0 C-38,-8 -66,-14 -78,-35 C-55,-23 -28,-18 0,0Z;M0,0 C-35,-5 -60,-10 -70,-30 C-50,-20 -25,-15 0,0Z" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C25,-15 50,-30 55,-55 C35,-35 15,-25 0,0Z" fill="#FBCB77" opacity=".2">
      <animate attributeName="d" values="M0,0 C25,-15 50,-30 55,-55 C35,-35 15,-25 0,0Z;M0,0 C28,-18 55,-34 62,-60 C40,-38 18,-28 0,0Z;M0,0 C25,-15 50,-30 55,-55 C35,-35 15,-25 0,0Z" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C35,-5 60,-10 70,-30 C50,-20 25,-15 0,0Z" fill="#AAB396" opacity=".15">
      <animate attributeName="d" values="M0,0 C35,-5 60,-10 70,-30 C50,-20 25,-15 0,0Z;M0,0 C38,-8 66,-14 78,-35 C55,-23 28,-18 0,0Z;M0,0 C35,-5 60,-10 70,-30 C50,-20 25,-15 0,0Z" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Ripple rings -->
  <circle cx="100" cy="90" r="15" stroke="#FBCB77" stroke-width=".8" fill="none" opacity=".3">
    <animate attributeName="r" values="15;45;45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;0;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="90" r="15" stroke="#AAB396" stroke-width=".8" fill="none" opacity=".3">
    <animate attributeName="r" values="15;45;45" dur="4s" repeatCount="indefinite" begin="1.3s"/>
    <animate attributeName="opacity" values=".3;0;0" dur="4s" repeatCount="indefinite" begin="1.3s"/>
  </circle>

  <!-- Central orb -->
  <circle cx="100" cy="90" r="10" fill="#FFBFBF" opacity=".15">
    <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.3;.15" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="90" r="5" fill="#FFBFBF" opacity=".3">
    <animate attributeName="opacity" values=".2;.45;.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Rising energy dots -->
  <circle cx="85" cy="70" r="2" fill="#FBCB77" opacity="0">
    <animate attributeName="cy" values="70;40" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.4;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="75" r="1.8" fill="#AAB396" opacity="0">
    <animate attributeName="cy" values="75;42" dur="6s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0;.35;0" dur="6s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="100" cy="65" r="2.2" fill="#FFBFBF" opacity="0">
    <animate attributeName="cy" values="65;30" dur="5.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="0;.3;0" dur="5.5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- Wave line -->
  <path d="M20 165 Q50 155 80 165 Q110 175 140 165 Q170 155 180 165" stroke="#AAB396" stroke-width="1" fill="none" opacity=".2" stroke-linecap="round">
    <animate attributeName="d" values="M20 165 Q50 155 80 165 Q110 175 140 165 Q170 155 180 165;M20 165 Q50 175 80 165 Q110 155 140 165 Q170 175 180 165;M20 165 Q50 155 80 165 Q110 175 140 165 Q170 155 180 165" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>

