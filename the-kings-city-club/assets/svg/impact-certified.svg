<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="40" stroke="var(--color-accent)" stroke-width="2" fill="none">
    <animate attributeName="r" from="40" to="45" dur="2s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="1" to="0" dur="2s" begin="0s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="40" stroke="var(--color-accent)" stroke-width="2" fill="none">
    <animate attributeName="r" from="40" to="45" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="1" to="0" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
  <path d="M30 50 L45 65 L70 35" stroke="var(--color-primary)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" from="0, 100" to="100, 0" dur="3s" repeatCount="indefinite" />
  </path>
</svg>
