<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    .ln{stroke:#2D2926;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .acc{fill:#AAB396;opacity:.5}
    .tl{fill:#FBCB77;opacity:.4}
  </style>

  <!-- Soft background -->
  <circle cx="100" cy="100" r="85" fill="#BD451F" opacity=".06"/>

  <!-- Easel legs -->
  <line x1="70" y1="170" x2="90" y2="105" class="ln" opacity=".4"/>
  <line x1="130" y1="170" x2="110" y2="105" class="ln" opacity=".4"/>
  <line x1="100" y1="170" x2="100" y2="120" class="ln" opacity=".3"/>

  <!-- Canvas on easel -->
  <rect x="60" y="40" width="80" height="68" rx="3" fill="#FFFEF5" opacity=".85" stroke="#BD451F" stroke-width="1.2"/>

  <!-- Design lines being drawn on canvas -->
  <rect x="70" y="52" width="0" height="4" rx="1" class="tl">
    <animate attributeName="width" values="0;35;35;35;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.5;.5;.5;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="70" y="62" width="0" height="3" rx="1" fill="#BD451F" opacity="0">
    <animate attributeName="width" values="0;0;50;50;50;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.35;.35;.35;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- Layout box -->
  <rect x="70" y="72" width="0" height="18" rx="2" class="acc" opacity="0">
    <animate attributeName="width" values="0;0;0;26;26;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0;.4;.4;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="72" width="0" height="18" rx="2" class="tl" opacity="0">
    <animate attributeName="width" values="0;0;0;0;26;0" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0;0;.35;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="70" y="95" width="0" height="3" rx="1" fill="#BD451F" opacity="0">
    <animate attributeName="width" values="0;0;0;0;55;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0;0;.25;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Pencil drawing on canvas — animated -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;30,12;50,25;30,35;55,45;0,0" dur="5s" repeatCount="indefinite"/>
    <line x1="62" y1="42" x2="56" y2="34" stroke="#FFBFBF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="42" r="1.5" fill="#2D2926" opacity=".6"/>
  </g>

  <!-- Compass tool floating left -->
  <g transform="translate(28,70)" opacity=".3">
    <animateTransform attributeName="transform" type="translate" values="28,70;28,62;28,70" dur="5s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="12" stroke="#BD451F" stroke-width="1" fill="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#BD451F" stroke-width=".8"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#BD451F" stroke-width=".8"/>
    </g>
  </g>

  <!-- Color swatches floating right -->
  <g transform="translate(165,65)" opacity=".35">
    <animateTransform attributeName="transform" type="translate" values="165,65;165,58;165,65" dur="6s" repeatCount="indefinite"/>
    <rect x="-10" y="-10" width="14" height="14" rx="3" fill="#BD451F" opacity=".6"/>
    <rect x="6" y="-10" width="14" height="14" rx="3" fill="#FBCB77" opacity=".6"/>
    <rect x="-2" y="6" width="14" height="14" rx="3" fill="#AAB396" opacity=".6"/>
  </g>

  <!-- Sparkle particles -->
  <circle cx="45" cy="35" r="2" fill="#FFBFBF" opacity="0">
    <animate attributeName="opacity" values="0;.4;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="35;25;35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="40" r="1.5" fill="#FBCB77" opacity="0">
    <animate attributeName="opacity" values="0;.35;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="40;30;40" dur="5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>

