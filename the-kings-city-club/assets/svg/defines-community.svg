<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    .ln{stroke:#2D2926;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <!-- Soft background -->
  <circle cx="100" cy="100" r="85" fill="#FBCB77" opacity=".06"/>

  <!-- Central hub circle (meeting point) -->
  <circle cx="100" cy="100" r="28" fill="#AAB396" opacity=".2">
    <animate attributeName="r" values="28;32;28" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;.3;.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="28" class="ln" opacity=".3">
    <animate attributeName="r" values="28;32;28" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit ring -->
  <ellipse cx="100" cy="100" rx="65" ry="65" stroke="#BD451F" stroke-width=".8" fill="none" opacity=".12" stroke-dasharray="6 4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="30s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Connection lines from nodes to center — pulse in -->
  <line x1="100" y1="72" x2="100" y2="40" stroke="#FBCB77" stroke-width="1.2" opacity=".25" stroke-dasharray="3 3">
    <animate attributeName="opacity" values=".15;.4;.15" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="75" y1="112" x2="45" y2="135" stroke="#FBCB77" stroke-width="1.2" opacity=".25" stroke-dasharray="3 3">
    <animate attributeName="opacity" values=".15;.4;.15" dur="3s" repeatCount="indefinite" begin=".8s"/>
  </line>
  <line x1="125" y1="112" x2="155" y2="135" stroke="#FBCB77" stroke-width="1.2" opacity=".25" stroke-dasharray="3 3">
    <animate attributeName="opacity" values=".15;.4;.15" dur="3s" repeatCount="indefinite" begin="1.6s"/>
  </line>

  <!-- Node: Top (person icon abstracted as circle) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4s" repeatCount="indefinite"/>
    <circle cx="100" cy="32" r="12" fill="#FFFEF5" opacity=".85" stroke="#BD451F" stroke-width="1.2"/>
    <circle cx="100" cy="30" r="4" fill="#BD451F" opacity=".4"/>
    <path d="M93 37 Q100 41 107 37" stroke="#BD451F" stroke-width="1" fill="none" opacity=".35"/>
  </g>

  <!-- Node: Bottom-left -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,3;0,0" dur="4s" repeatCount="indefinite" begin="-.8s"/>
    <circle cx="40" cy="142" r="12" fill="#FFFEF5" opacity=".85" stroke="#FBCB77" stroke-width="1.2"/>
    <circle cx="40" cy="140" r="4" fill="#FBCB77" opacity=".4"/>
    <path d="M33 147 Q40 151 47 147" stroke="#FBCB77" stroke-width="1" fill="none" opacity=".35"/>
  </g>

  <!-- Node: Bottom-right -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;4,3;0,0" dur="4s" repeatCount="indefinite" begin="-1.6s"/>
    <circle cx="160" cy="142" r="12" fill="#FFFEF5" opacity=".85" stroke="#AAB396" stroke-width="1.2"/>
    <circle cx="160" cy="140" r="4" fill="#6B9E7A" opacity=".4"/>
    <path d="M153 147 Q160 151 167 147" stroke="#6B9E7A" stroke-width="1" fill="none" opacity=".35"/>
  </g>

  <!-- Chat bubbles floating from nodes -->
  <!-- Bubble from top node -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;.5;.5;0" dur="4s" repeatCount="indefinite"/>
    <rect x="115" y="18" width="22" height="14" rx="5" fill="#BD451F" opacity=".2" stroke="#BD451F" stroke-width=".8"/>
    <line x1="120" y1="24" x2="131" y2="24" stroke="#BD451F" stroke-width="1" opacity=".3"/>
  </g>

  <!-- Bubble from bottom-left -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;.5;.5;0" dur="4s" repeatCount="indefinite" begin="1.3s"/>
    <rect x="12" y="122" width="18" height="12" rx="4" fill="#FBCB77" opacity=".2" stroke="#FBCB77" stroke-width=".8"/>
    <line x1="16" y1="128" x2="26" y2="128" stroke="#FBCB77" stroke-width="1" opacity=".3"/>
  </g>

  <!-- Bubble from bottom-right -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;.5;.5;0" dur="4s" repeatCount="indefinite" begin="2.6s"/>
    <rect x="170" y="122" width="20" height="12" rx="4" fill="#AAB396" opacity=".25" stroke="#6B9E7A" stroke-width=".8"/>
    <line x1="174" y1="128" x2="186" y2="128" stroke="#6B9E7A" stroke-width="1" opacity=".3"/>
  </g>

  <!-- Traveling dot from node to center (data/connection flowing) -->
  <circle r="3" fill="#BD451F" opacity=".4">
    <animateMotion path="M100,32 L100,100" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.5;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#FBCB77" opacity=".4">
    <animateMotion path="M40,142 L100,100" dur="2s" repeatCount="indefinite" begin=".7s"/>
    <animate attributeName="opacity" values="0;.5;0" dur="2s" repeatCount="indefinite" begin=".7s"/>
  </circle>
  <circle r="3" fill="#6B9E7A" opacity=".4">
    <animateMotion path="M160,142 L100,100" dur="2s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0;.5;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
  </circle>

  <!-- Central handshake/heart symbol -->
  <g transform="translate(100,100)" opacity=".5">
    <animate attributeName="opacity" values=".4;.7;.4" dur="4s" repeatCount="indefinite"/>
    <path d="M-8,-3 Q-8,-9 -3,-9 Q0,-9 0,-5 Q0,-9 3,-9 Q8,-9 8,-3 Q8,4 0,10 Q-8,4 -8,-3Z" fill="#FFBFBF" opacity=".5"/>
  </g>

  <!-- Ambient sparkles -->
  <circle cx="70" cy="55" r="1.5" fill="#FFBFBF" opacity="0">
    <animate attributeName="opacity" values="0;.35;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="70" r="1.5" fill="#FBCB77" opacity="0">
    <animate attributeName="opacity" values="0;.3;0" dur="6s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>

